<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrewGuide · Feature Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0e0c0a;
    --surface:   #161310;
    --card:      #1c1814;
    --border:    rgba(255,255,255,0.06);
    --text:      #f0ece6;
    --muted:     #7a7168;
    --gold:      #c8860a;
    --gold-dim:  rgba(200,134,10,0.12);
    --gold-glow: rgba(200,134,10,0.25);
    --teal:      #1d9e75;
    --teal-dim:  rgba(29,158,117,0.12);
    --amber:     #ba7517;
    --amber-dim: rgba(186,117,23,0.12);
    --purple:    #534ab7;
    --purple-dim:rgba(83,74,183,0.12);
    --done-bg:   rgba(29,158,117,0.08);
    --done-border: rgba(29,158,117,0.3);
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    padding: 0 0 80px;
  }

  /* ── HEADER ── */
  header {
    padding: 52px 40px 36px;
    border-bottom: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }

  header::before {
    content: '';
    position: absolute;
    top: -60px; left: -60px;
    width: 320px; height: 320px;
    background: radial-gradient(circle, rgba(200,134,10,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .header-inner {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-icon {
    width: 40px; height: 40px;
    background: var(--gold-dim);
    border: 1px solid rgba(200,134,10,0.3);
    border-radius: 10px;
    display: grid;
    place-items: center;
    font-size: 20px;
  }

  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    font-weight: 400;
    letter-spacing: -0.3px;
    line-height: 1;
  }

  h1 span {
    color: var(--gold);
  }

  .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.02em;
  }

  /* ── STATS BAR ── */
  .stats-bar {
    max-width: 900px;
    margin: 32px auto 0;
    padding: 0 40px;
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
  }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .stat-value {
    font-family: 'DM Serif Display', serif;
    font-size: 32px;
    line-height: 1;
    color: var(--gold);
  }

  .stat-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-family: 'DM Mono', monospace;
  }

  .progress-bar-wrap {
    flex: 1;
    min-width: 200px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 6px;
  }

  .progress-track {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--teal), var(--gold));
    border-radius: 2px;
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .progress-label {
    font-size: 11px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
  }

  /* ── FILTER TABS ── */
  .filters {
    max-width: 900px;
    margin: 36px auto 0;
    padding: 0 40px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .filter-label {
    font-size: 11px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-right: 4px;
  }

  .filter-btn {
    padding: 5px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 400;
    cursor: pointer;
    transition: all 0.15s;
  }

  .filter-btn:hover { border-color: rgba(255,255,255,0.15); color: var(--text); }

  .filter-btn.active {
    background: var(--gold-dim);
    border-color: rgba(200,134,10,0.4);
    color: var(--gold);
  }

  /* ── SECTIONS ── */
  .main {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 40px;
  }

  .section {
    margin-top: 44px;
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .section-title {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
  }

  .section-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .section-count {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  /* ── GRID ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  @media (max-width: 700px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    header, .stats-bar, .filters, .main { padding-left: 20px; padding-right: 20px; }
    h1 { font-size: 22px; }
  }

  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; }
  }

  /* ── FEATURE CARD ── */
  .card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, transform 0.12s;
    user-select: none;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    border-radius: 10px 10px 0 0;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .card:hover { transform: translateY(-1px); }
  .card:active { transform: translateY(0); }

  /* type colours */
  .card.new    { --accent: var(--teal);   --accent-dim: var(--teal-dim); }
  .card.improve{ --accent: var(--amber);  --accent-dim: var(--amber-dim); }
  .card.v2     { --accent: var(--purple); --accent-dim: var(--purple-dim); }

  .card:hover  { border-color: rgba(255,255,255,0.12); }
  .card::before { background: var(--accent); }
  .card:hover::before { opacity: 1; }

  /* done state */
  .card.done {
    background: var(--done-bg);
    border-color: var(--done-border);
  }

  .card.done::before {
    background: var(--teal);
    opacity: 1;
  }

  .card.done .card-title { color: #6ee7b7; }
  .card.done .card-sub   { color: rgba(110,231,183,0.6); }

  /* hidden by filter */
  .card.hidden {
    display: none;
  }

  /* ── CARD INTERNALS ── */
  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }

  .card-title {
    font-size: 13px;
    font-weight: 500;
    line-height: 1.3;
    color: var(--text);
    transition: color 0.15s;
  }

  .card-check {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    display: grid;
    place-items: center;
    flex-shrink: 0;
    margin-top: 1px;
    transition: all 0.2s;
    background: transparent;
  }

  .card.done .card-check {
    background: var(--teal);
    border-color: var(--teal);
  }

  .checkmark {
    opacity: 0;
    transform: scale(0);
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    color: #fff;
    font-size: 10px;
    line-height: 1;
  }

  .card.done .checkmark { opacity: 1; transform: scale(1); }

  .card-sub {
    font-size: 11px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    transition: color 0.15s;
  }

  .card-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 10px;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.04em;
    background: var(--accent-dim);
    color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
  }

  .badge-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
  }

  /* ── DONE STREAK ── */
  .streak-bar {
    max-width: 900px;
    margin: 48px auto 0;
    padding: 0 40px;
  }

  .streak-inner {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  .streak-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    white-space: nowrap;
  }

  .streak-dots {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    flex: 1;
  }

  .streak-dot {
    width: 10px; height: 10px;
    border-radius: 2px;
    background: var(--border);
    transition: background 0.3s;
  }

  .streak-dot.done { background: var(--teal); }

  .streak-pct {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    color: var(--gold);
    white-space: nowrap;
  }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #1e1a15;
    border: 1px solid rgba(200,134,10,0.3);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 13px;
    font-family: 'DM Mono', monospace;
    pointer-events: none;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
    opacity: 0;
    white-space: nowrap;
    z-index: 100;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">☕</div>
      <div>
        <h1>Brew<span>Guide</span></h1>
        <div class="subtitle">feature tracker</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="done">✓ Done</button>
      <button class="filter-btn" data-filter="todo">To do</button>
    </div>
  </div>
</header>

<div class="stats-bar">
  <div class="stat">
    <div class="stat-value" id="stat-done">0</div>
    <div class="stat-label">implemented</div>
  </div>
  <div class="stat">
    <div class="stat-value" id="stat-total">0</div>
    <div class="stat-label">total features</div>
  </div>
  <div class="stat">
    <div class="stat-value" id="stat-pct">0%</div>
    <div class="stat-label">complete</div>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-label" id="progress-label">0 of 0 features shipped</div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>
</div>

<div class="main" id="main"></div>

<div class="streak-bar">
  <div class="streak-inner">
    <div class="streak-label">All features</div>
    <div class="streak-dots" id="streak-dots"></div>
    <div class="streak-pct" id="streak-pct">0%</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const FEATURES = [
  {
    section: "Brew session experience",
    type: "new",
    items: [
      { id: "brew-journal",    title: "Brew journal",       sub: "Log sessions, notes, ratings" },
      { id: "dose-calc",       title: "Dose calculator",    sub: "Target strength / TDS input" },
      { id: "grinder-cal",     title: "Grinder calibration",sub: "Map steps to user's grinder" },
      { id: "bloom-timer",     title: "Bloom phase timer",  sub: "Dedicated pre-infusion step" },
    ]
  },
  {
    section: "Brew session experience",
    type: "improve",
    items: [
      { id: "step-visuals",    title: "Richer step visuals",   sub: "Animations, pour diagrams" },
      { id: "water-callout",   title: "Water callout UX",      sub: "Larger, animated on step start" },
    ]
  },
  {
    section: "Personalisation & memory",
    type: "improve",
    items: [
      { id: "favourites",      title: "Favourites & recents",  sub: "Pin methods, quick re-brew" },
      { id: "custom-ratio",    title: "Custom ratio presets",  sub: "Save personal brew ratios" },
      { id: "per-technique",   title: "Per-technique defaults", sub: "Remember last serving size" },
    ]
  },
  {
    section: "Personalisation & memory",
    type: "new",
    items: [
      { id: "brew-insights",   title: "Brew history insights", sub: "Most-used methods, streaks" },
      { id: "equip-profiles",  title: "Equipment profiles",    sub: "My grinder, kettle, scale" },
      { id: "post-brew",       title: "Post-brew rating",      sub: "Star rating + flavour notes" },
    ]
  },
  {
    section: "Discovery & content",
    type: "new",
    items: [
      { id: "search-filter",   title: "Search & filter",       sub: "By time, flavour, difficulty" },
      { id: "bean-first",      title: "Bean-first flow",        sub: "Start from a bean → get methods" },
      { id: "daily-suggest",   title: "Daily suggestion",       sub: "Featured technique of the day" },
      { id: "water-quality",   title: "Water quality guide",    sub: "TDS, hardness, filter tips" },
    ]
  },
  {
    section: "Discovery & content",
    type: "improve",
    items: [
      { id: "richer-beans",    title: "Richer bean cards",      sub: "Origin map, processing detail" },
      { id: "tech-deepdive",   title: "Technique deep-dives",   sub: "Video links, origin story" },
    ]
  },
  {
    section: "Platform & system integration",
    type: "v2",
    items: [
      { id: "live-activity",   title: "Live Activity timer",    sub: "Dynamic Island + lock screen" },
      { id: "home-widget",     title: "Home screen widget",     sub: "Quick-start favourite brew" },
      { id: "siri-shortcuts",  title: "Siri Shortcuts",         sub: "Voice-start a favourite brew" },
      { id: "bt-scale",        title: "Smart scale BT",         sub: "Auto-detect weight on scale" },
      { id: "apple-watch",     title: "Apple Watch app",        sub: "Timer + step on wrist" },
      { id: "shareplay",       title: "SharePlay brew-along",   sub: "Sync timers with a friend" },
    ]
  },
];

const TYPE_LABELS = {
  new:     "New feature",
  improve: "Improvement",
  v2:      "Post-MVP / v2",
};

const STORAGE_KEY = "brewguide-tracker-v1";

// ── State ──────────────────────────────────────────────
let done = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
let activeFilter = "all";

// ── Build DOM ──────────────────────────────────────────
const main = document.getElementById("main");

// Group by section name
const sectionMap = {};
FEATURES.forEach(group => {
  if (!sectionMap[group.section]) sectionMap[group.section] = [];
  group.items.forEach(item => {
    sectionMap[group.section].push({ ...item, type: group.type });
  });
});

Object.entries(sectionMap).forEach(([sectionName, items]) => {
  const sec = document.createElement("div");
  sec.className = "section";
  sec.dataset.section = sectionName;

  sec.innerHTML = `
    <div class="section-header">
      <div class="section-title">${sectionName}</div>
      <div class="section-line"></div>
      <div class="section-count" id="count-${slugify(sectionName)}"></div>
    </div>
    <div class="grid" id="grid-${slugify(sectionName)}"></div>
  `;
  main.appendChild(sec);

  const grid = sec.querySelector(".grid");
  items.forEach(item => {
    const card = document.createElement("div");
    card.className = `card ${item.type}`;
    card.dataset.id = item.id;
    card.dataset.type = item.type;
    card.innerHTML = `
      <div class="card-top">
        <div class="card-title">${item.title}</div>
        <div class="card-check"><span class="checkmark">✓</span></div>
      </div>
      <div class="card-sub">${item.sub}</div>
      <div class="card-badge"><span class="badge-dot"></span>${TYPE_LABELS[item.type]}</div>
    `;
    card.addEventListener("click", () => toggle(item.id, card));
    grid.appendChild(card);
  });
});

// ── Streak dots ────────────────────────────────────────
const allItems = FEATURES.flatMap(g => g.items.map(i => i.id));
const streakDots = document.getElementById("streak-dots");
allItems.forEach(id => {
  const dot = document.createElement("div");
  dot.className = "streak-dot";
  dot.dataset.id = id;
  streakDots.appendChild(dot);
});

// ── Filter buttons ─────────────────────────────────────
document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    activeFilter = btn.dataset.filter;
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    applyFilter();
  });
});

// ── Toggle ─────────────────────────────────────────────
function toggle(id, card) {
  done[id] = !done[id];
  localStorage.setItem(STORAGE_KEY, JSON.stringify(done));
  render();
  showToast(done[id] ? "✓ Marked as done" : "Unmarked");
}

// ── Render ─────────────────────────────────────────────
function render() {
  const total = allItems.length;
  const doneCount = allItems.filter(id => done[id]).length;
  const pct = total > 0 ? Math.round((doneCount / total) * 100) : 0;

  document.getElementById("stat-done").textContent  = doneCount;
  document.getElementById("stat-total").textContent = total;
  document.getElementById("stat-pct").textContent   = pct + "%";
  document.getElementById("progress-fill").style.width = pct + "%";
  document.getElementById("progress-label").textContent =
    `${doneCount} of ${total} features shipped`;
  document.getElementById("streak-pct").textContent = pct + "%";

  // cards
  document.querySelectorAll(".card").forEach(card => {
    const id = card.dataset.id;
    card.classList.toggle("done", !!done[id]);
  });

  // streak dots
  document.querySelectorAll(".streak-dot").forEach(dot => {
    dot.classList.toggle("done", !!done[dot.dataset.id]);
  });

  // section counts
  Object.entries(sectionMap).forEach(([sectionName, items]) => {
    const doneInSection = items.filter(i => done[i.id]).length;
    const el = document.getElementById("count-" + slugify(sectionName));
    if (el) el.textContent = `${doneInSection}/${items.length}`;
  });

  applyFilter();
}

function applyFilter() {
  document.querySelectorAll(".card").forEach(card => {
    const isDone = !!done[card.dataset.id];
    let show = true;
    if (activeFilter === "done" && !isDone) show = false;
    if (activeFilter === "todo" && isDone) show = false;
    card.classList.toggle("hidden", !show);
  });
}

// ── Toast ──────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

// ── Helpers ────────────────────────────────────────────
function slugify(s) {
  return s.toLowerCase().replace(/[^a-z0-9]+/g, "-");
}

// ── Init ───────────────────────────────────────────────
render();
</script>
</body>
</html>
