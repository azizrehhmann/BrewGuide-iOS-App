<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Category figures, dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=Playfair+Display:ital,wght@0,400;1,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#E3B978}a:hover{color:#F1CF97}
</style>
</helmet>
<div style="width: 1360px; height: 760px; box-sizing: border-box; padding: 40px 48px; background: #131313; color: #F0ECE8; font-family: 'DM Sans', system-ui, sans-serif; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
  <sc-for list="{{figures}}" as="f" hint-placeholder-count="6">
    <figure style="margin: 0; background: #1E1E1E; border-radius: 22px; border: 1px solid rgba(240,236,232,0.07); padding: 12px 20px 18px; display: flex; flex-direction: column">
      <img src="{{f.src}}" alt="{{f.alt}}" style="width: 100%; height: 252px; object-fit: contain">
      <figcaption style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-family: 'Playfair Display', serif; font-size: 22px">{{f.name}}</span>
        <span style="font-size: 13px; color: #B5ADA6">{{f.example}}</span>
      </figcaption>
    </figure>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      figures: [
        { name: 'Pour over', example: 'V60 on a glass server', src: '/_blob/2d04424b1851c0d9a68a004e79c9e37f', alt: 'A V60 dripper on a glass server' },
        { name: 'Immersion', example: 'French press', src: '/_blob/c41c99b7bec589e1cc92b1aca0e6eff2', alt: 'A French press with the plunger raised' },
        { name: 'Pressure', example: 'AeroPress on a mug', src: '/_blob/6a727eb934e3b0f9c83acb4299b73dab', alt: 'An AeroPress pressed into a mug' },
        { name: 'Cold brew', example: 'Jar with a filter sock', src: '/_blob/97a4c5e6f310c93afe3d448274328496', alt: 'A cold-brew jar with a filter sock and a screw lid' },
        { name: 'Stovetop', example: 'Moka pot on a burner', src: '/_blob/9e963b7b5097e5839300f76d17688bf4', alt: 'A moka pot on a burner grate' },
        { name: 'Machine', example: 'Group head and portafilter', src: '/_blob/e083d277f64d0c7965a65d40a385ccf3', alt: 'An espresso group head, portafilter and cup on the drip tray' }
      ]
    };
  }
}
</script>
</body>
</html>
